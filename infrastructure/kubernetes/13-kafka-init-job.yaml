# One-shot topic bootstrap — identical script to docker-compose's kafka-init service (see
# infrastructure/kafka/create-topics.sh). Kubernetes Jobs have no native "wait for another
# workload's readiness probe" primitive the way docker-compose's `depends_on: condition:
# service_healthy` does, so an initContainer polls the broker directly before the real script runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-init-scripts
  namespace: meridian-bank
data:
  create-topics.sh: |
    #!/bin/bash
    set -euo pipefail
    BOOTSTRAP_SERVER="kafka:19092"
    PARTITIONS=3
    REPLICATION_FACTOR=1
    TOPICS=(
      "customer.created" "kyc.updated" "account.created" "account.approved"
      "payment.initiated" "payment.completed" "payment.failed" "payment.reversed"
      "fraud.detected" "notification.requested" "audit.event" "reconciliation.completed"
      "customer.created.DLQ" "kyc.updated.DLQ" "account.created.DLQ" "account.approved.DLQ"
      "payment.initiated.DLQ" "payment.completed.DLQ" "payment.failed.DLQ" "fraud.detected.DLQ"
      "audit.event.DLQ" "reconciliation.completed.DLQ" "notification.requested.DLQ"
    )
    for topic in "${TOPICS[@]}"; do
      echo "Ensuring topic '${topic}' exists..."
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BOOTSTRAP_SERVER}" \
        --create --if-not-exists --topic "${topic}" \
        --partitions "${PARTITIONS}" --replication-factor "${REPLICATION_FACTOR}"
    done
    echo "Meridian Bank: Kafka topic bootstrap complete."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: meridian-bank
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: apache/kafka:3.8.0
          command:
            - /bin/bash
            - -c
            - |
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092; do
                echo "Waiting for kafka..."; sleep 5
              done
      containers:
        - name: create-topics
          image: apache/kafka:3.8.0
          command: ["/bin/bash", "/scripts/create-topics.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: kafka-init-scripts
            defaultMode: 0755
