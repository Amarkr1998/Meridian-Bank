# LOCAL/DEMO DEFAULTS ONLY — identical values to the root .env.example, never real secrets.
# Real usage would generate these via a secrets manager / sealed-secrets / external-secrets
# operator and never check plaintext values into source control; this file exists only because
# this whole project's threat model is "runs on one developer's laptop, no real data" (see
# CLAUDE.md's Non-Negotiable Safety Rules). `stringData` is used instead of `data` purely for
# readability — Kubernetes base64-encodes it into the underlying Secret object automatically.
apiVersion: v1
kind: Secret
metadata:
  name: meridian-secrets
  namespace: meridian-bank
type: Opaque
stringData:
  POSTGRES_PASSWORD: "meridian_local_dev"
  MERIDIAN_JWT_SECRET: "meridian-bank-local-demo-jwt-signing-secret-change-me-32bytes-min"
  MERIDIAN_ADMIN_PASSWORD: "ChangeMe!Local1"
  GRAFANA_ADMIN_PASSWORD: "ChangeMe!Local1"
