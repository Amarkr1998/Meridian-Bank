# Kafka — single-node KRaft broker (combined broker+controller roles), matching docker-compose
# exactly (see docs/adr/0002-kafka-event-backbone.md). Only the host-facing PLAINTEXT_HOST
# listener docker-compose exposes for `localhost:9092` access from the developer's machine is
# dropped here — nothing running outside the cluster needs to reach Kafka directly in K8s; use
# `kubectl port-forward` if that's ever needed for local debugging.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: meridian-bank
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 19092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:19092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            # Default broker<->controller session/heartbeat timeouts (9s / 18s) assume a broker
            # thread gets scheduled promptly. On this 4-CPU demo node, under the real contention
            # from 9 services' JVMs booting at once, that thread can be starved long enough that
            # the controller (running in the SAME JVM, since this is a combined broker+controller
            # single-node KRaft setup) considers the broker dead — which fatally aborts broker
            # startup with "unable to register with the controller quorum" even though nothing is
            # actually wrong with Kafka itself. Found live during Phase 18 testing — see
            # infrastructure/kubernetes/README.md, "Where this deliberately differs...". Widening
            # both timeouts gives the scheduler enough slack to avoid this false-fatal shutdown.
            - name: KAFKA_BROKER_SESSION_TIMEOUT_MS
              value: "60000"
            - name: KAFKA_BROKER_HEARTBEAT_INTERVAL_MS
              value: "6000"
            - name: KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS
              value: "60000"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: CLUSTER_ID
              value: "MeridianBankLocalKRaftCluster"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          # `kafka-broker-api-versions.sh` launches a whole new JVM per invocation, which routinely
          # takes several seconds — K8s exec probes default to timeoutSeconds: 1, so without an
          # explicit override every single check "fails" from a timeout alone (Kafka itself is
          # fine), and the liveness probe then kills a perfectly healthy broker. Discovered live:
          # see infrastructure/kubernetes/README.md, "Where this deliberately differs...".
          # startupProbe: a cheap TCP check, generously budgeted — on this 4-CPU demo node, 10+
          # JVMs (9 services + Kafka) booting at once genuinely starve each other of CPU, and
          # without a startupProbe, liveness kills the broker mid-boot using its own
          # initialDelaySeconds, forever (a real thundering-herd crash loop discovered during
          # Phase 18 live testing — see infrastructure/kubernetes/README.md,
          # "Where this deliberately differs..."). Liveness/readiness are disabled until this
          # succeeds once.
          startupProbe:
            tcpSocket:
              port: 19092
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:19092"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 15
          # Liveness uses a plain TCP check instead of the same JVM-launching exec — cheap, fast,
          # and sufficient to catch a genuinely wedged process without the exec probe's cost/risk.
          livenessProbe:
            tcpSocket:
              port: 19092
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: "300m", memory: "768Mi" }
            limits: { cpu: "1500m", memory: "1536Mi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: meridian-bank
spec:
  selector:
    app: kafka
  # publishNotReadyAddresses: this single combined broker+controller node must resolve its own
  # per-pod DNS name (kafka-0.kafka, from KAFKA_CONTROLLER_QUORUM_VOTERS) to register with its
  # own controller quorum DURING startup — but a headless Service only publishes a pod's DNS
  # record once that pod is Ready by default, and the pod can never become Ready without first
  # completing that registration. Without this flag the two conditions deadlock permanently: no
  # DNS record until Ready, no Ready until DNS resolves (observed live as a persistent, 100%
  # reproducible `UnknownHostException: kafka-0.kafka` during Phase 18 testing, independent of
  # node load — see infrastructure/kubernetes/README.md, "Where this deliberately differs...").
  # This is the standard, documented fix for self-referential StatefulSet members (the same
  # pattern used for Cassandra/etcd/Kafka-style clustered headless Services).
  publishNotReadyAddresses: true
  ports:
    - name: plaintext
      port: 19092
      targetPort: 19092
    - name: controller
      port: 9093
      targetPort: 9093
  clusterIP: None
