# replicas: 2 — the other stateless service this deployment demonstrates horizontal scaling on
# (see docs/architecture/deployment-architecture.md), matched by an HPA in 30-autoscaling.yaml.
# No wait-for-postgres initContainer: this service has no database at all, and its Redis-backed
# rate limiter fails open on a Redis error by design (see services/api-gateway/README.md) — it
# doesn't need to wait for anything to start safely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: meridian-bank
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: meridianbank-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: meridian-config }
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: MERIDIAN_JWT_SECRET
              valueFrom: { secretKeyRef: { name: meridian-secrets, key: MERIDIAN_JWT_SECRET } }
            - name: MERIDIAN_GATEWAY_CORS_ALLOWED_ORIGINS
              value: "http://localhost:5173"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"
            - name: CUSTOMER_KYC_SERVICE_URL
              value: "http://customer-kyc-service:8082"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service:8083"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8084"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8088"
            - name: FRAUD_RISK_SERVICE_URL
              value: "http://fraud-risk-service:8086"
            - name: LEDGER_SERVICE_URL
              value: "http://ledger-service:8085"
            - name: AUDIT_SERVICE_URL
              value: "http://audit-service:8087"
          # startupProbe: see 20-auth-service.yaml for why this exists (CPU-starved cold boot on
          # this 4-CPU node — real thundering-herd crash loop found during Phase 18 live testing).
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 12
          resources:
            requests: { cpu: "80m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: meridian-bank
spec:
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
