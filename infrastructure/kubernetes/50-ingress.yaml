# Only api-gateway is exposed via Ingress — see docs/architecture/deployment-architecture.md's
# Kubernetes diagram: "Ingress -> Service: api-gateway" is the single entry point, exactly as
# ADR-0009 intends. Nothing else gets an Ingress rule; every other service is reached only via
# in-cluster Service DNS. Requires an ingress controller addon
# (`minikube addons enable ingress`, or Kind's ingress-nginx manifest) — see README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meridian-gateway
  namespace: meridian-bank
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  rules:
    - host: meridian.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
