apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-risk-service
  namespace: meridian-bank
spec:
  replicas: 1
  selector:
    matchLabels: { app: fraud-risk-service }
  template:
    metadata:
      labels: { app: fraud-risk-service }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U meridian; do echo waiting for postgres; sleep 3; done"]
      containers:
        - name: fraud-risk-service
          image: meridianbank-fraud-risk-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef: { name: meridian-config }
          env:
            - name: DB_NAME
              value: "fraud_risk_service"
            - name: SERVER_PORT
              value: "8086"
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: meridian-secrets, key: POSTGRES_PASSWORD } }
            - name: MERIDIAN_JWT_SECRET
              valueFrom: { secretKeyRef: { name: meridian-secrets, key: MERIDIAN_JWT_SECRET } }
          # startupProbe: see 20-auth-service.yaml for why this exists (CPU-starved cold boot on
          # this 4-CPU node — real thundering-herd crash loop found during Phase 18 live testing).
          startupProbe:
            httpGet: { path: /actuator/health, port: 8086 }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8086 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8086 }
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 12
          resources:
            requests: { cpu: "100m", memory: "384Mi" }
            limits: { cpu: "750m", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-risk-service
  namespace: meridian-bank
spec:
  selector: { app: fraud-risk-service }
  ports:
    - port: 8086
      targetPort: 8086
