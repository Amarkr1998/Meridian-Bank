name: CI and delivery validation

# CI validates source, tests, container images, Compose, and Kubernetes. Version tags additionally
# produce a traceable local-deployment bundle. There is deliberately no push to a registry or
# unattended environment deployment because this project has no remote deployment target.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  backend:
    name: backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - customer-kyc-service
          - account-service
          - payment-service
          - ledger-service
          - fraud-risk-service
          - audit-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # GitHub-hosted ubuntu runners ship Docker pre-installed and running, which is what every
      # service's Testcontainers-based integration tests need — no extra setup required.
      - name: mvn verify
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B verify

      - name: Upload surefire/failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Type-check + build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

  docker-build:
    name: docker build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - customer-kyc-service
          - account-service
          - payment-service
          - ledger-service
          - fraud-risk-service
          - audit-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push — no registry configured for this local-only project)
        run: docker build -t meridianbank-${{ matrix.service }}:ci "services/${{ matrix.service }}"

  compose-config:
    name: docker-compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q

  kubernetes-config:
    name: kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kubectl client-side dry runs still perform API discovery and fail when CI has no cluster.
      # kubeconform validates the rendered resources against Kubernetes schemas entirely offline.
      - name: Validate Kubernetes manifests offline
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          args: -strict -summary infrastructure/kubernetes

  delivery-bundle:
    name: tagged delivery bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, docker-build, compose-config, kubernetes-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build traceable local-deployment bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p delivery
          git ls-files -z | tar --null -czf "delivery/meridian-bank-${version}.tar.gz" --files-from=-
          {
            echo "version=${version}"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "deployment_targets=docker-compose,kubernetes"
          } > delivery/manifest.txt

      - name: Upload delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: meridian-bank-${{ github.ref_name }}
          path: delivery/
          if-no-files-found: error
          retention-days: 30
