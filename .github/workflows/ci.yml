name: CI

# Continuous Integration only. There is deliberately no continuous-deployment job here: this
# project has no real cloud/staging target to deploy to (see CLAUDE.md — "everything must run
# locally without paid cloud services"), so "CD" for a project like this means proving every
# service is genuinely buildable and deployable, not shipping it somewhere. The `docker-build`
# job below is that proof — it builds every service's real multi-stage Dockerfile (the same one
# `docker compose build` and the Kubernetes manifests both use) on every push, with no registry
# push, so a broken Dockerfile is caught here rather than at the next `docker compose up --build`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  backend:
    name: backend / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - customer-kyc-service
          - account-service
          - payment-service
          - ledger-service
          - fraud-risk-service
          - audit-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # GitHub-hosted ubuntu runners ship Docker pre-installed and running, which is what every
      # service's Testcontainers-based integration tests need — no extra setup required.
      - name: mvn verify
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B verify

      - name: Upload surefire/failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Type-check + build
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm test

  docker-build:
    name: docker build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - customer-kyc-service
          - account-service
          - payment-service
          - ledger-service
          - fraud-risk-service
          - audit-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push — no registry configured for this local-only project)
        run: docker build -t meridianbank-${{ matrix.service }}:ci "services/${{ matrix.service }}"

  compose-config:
    name: docker-compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q
