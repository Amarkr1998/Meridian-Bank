spring:
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:account_service}
    username: ${DB_USER:meridian}
    password: ${DB_PASSWORD:meridian_local_dev}
    hikari:
      # Shorter than Hikari's 30s default: OutboxPublisher polls on a fixed schedule, so a slow/
      # unreachable database should fail this attempt fast and let the next tick retry, rather
      # than block a scheduler thread for 30s.
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  health:
    kafka:
      # The outbox publisher already degrades independently on a Kafka outage (rows simply queue
      # as PENDING and retry — see OutboxPublisher); this service's own health/readiness must not
      # flip unhealthy just because Kafka is temporarily down, matching the fail-open philosophy
      # used elsewhere in this project (e.g. this service's own ledger balance lookup).
      enabled: false

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-'-'}] %logger{36} - %msg%n"

meridian:
  security:
    jwt:
      # Must match auth-service's signing secret exactly — this service only verifies tokens,
      # it never issues them. LOCAL/DEMO DEFAULT ONLY.
      secret: ${MERIDIAN_JWT_SECRET:meridian-bank-local-demo-jwt-signing-secret-change-me-32bytes-min}
  customer-kyc-service:
    base-url: ${CUSTOMER_KYC_SERVICE_BASE_URL:http://localhost:8082}
  ledger-service:
    base-url: ${LEDGER_SERVICE_BASE_URL:http://localhost:8085}
  outbox:
    poll-interval-ms: ${MERIDIAN_OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${MERIDIAN_OUTBOX_BATCH_SIZE:20}
    max-attempts: ${MERIDIAN_OUTBOX_MAX_ATTEMPTS:5}
    base-backoff-seconds: ${MERIDIAN_OUTBOX_BASE_BACKOFF_SECONDS:5}
    max-backoff-seconds: ${MERIDIAN_OUTBOX_MAX_BACKOFF_SECONDS:300}
  account:
    default-currency: ${MERIDIAN_ACCOUNT_DEFAULT_CURRENCY:USD}
    default-per-transaction-limit: ${MERIDIAN_ACCOUNT_DEFAULT_PER_TX_LIMIT:5000.00}
    default-daily-limit: ${MERIDIAN_ACCOUNT_DEFAULT_DAILY_LIMIT:20000.00}
    beneficiary-verification:
      otp-ttl-seconds: ${MERIDIAN_BENEFICIARY_OTP_TTL_SECONDS:300}
      max-attempts: ${MERIDIAN_BENEFICIARY_OTP_MAX_ATTEMPTS:5}
      # Demo-only, same rationale as auth-service's MFA demo mode: no real email/SMS channel
      # until notification-service (Phase 13).
      demo-expose-otp: ${MERIDIAN_BENEFICIARY_OTP_DEMO_EXPOSE:true}

resilience4j:
  circuitbreaker:
    instances:
      customerKycService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
      ledgerService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
