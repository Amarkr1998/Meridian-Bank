spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # Rate limiting fails open on a Redis error (see RateLimitFilter) — a Redis outage
      # degrades a defense-in-depth feature, it shouldn't flip the whole edge unhealthy.
      enabled: false

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-'-'}] %logger{36} - %msg%n"

meridian:
  security:
    jwt:
      # Must match auth-service's signing secret exactly — the gateway only verifies tokens
      # (signature + expiry) as a coarse edge check; it never issues them. LOCAL/DEMO DEFAULT ONLY.
      secret: ${MERIDIAN_JWT_SECRET:meridian-bank-local-demo-jwt-signing-secret-change-me-32bytes-min}
  gateway:
    cors:
      allowed-origins: ${MERIDIAN_GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    rate-limit:
      max-requests-per-window: ${MERIDIAN_GATEWAY_RATE_LIMIT_MAX:300}
      window-seconds: ${MERIDIAN_GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}
    upstream:
      connect-timeout-ms: ${MERIDIAN_GATEWAY_UPSTREAM_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${MERIDIAN_GATEWAY_UPSTREAM_READ_TIMEOUT_MS:10000}
    services:
      # Phase 14 added the first five (the customer portal's needs). Phase 15 (Operations &
      # Compliance Portal) added the rest.
      auth-service: ${AUTH_SERVICE_URL:http://localhost:8081}
      customer-kyc-service: ${CUSTOMER_KYC_SERVICE_URL:http://localhost:8082}
      account-service: ${ACCOUNT_SERVICE_URL:http://localhost:8083}
      payment-service: ${PAYMENT_SERVICE_URL:http://localhost:8084}
      notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
      fraud-risk-service: ${FRAUD_RISK_SERVICE_URL:http://localhost:8086}
      ledger-service: ${LEDGER_SERVICE_URL:http://localhost:8085}
      audit-service: ${AUDIT_SERVICE_URL:http://localhost:8087}
